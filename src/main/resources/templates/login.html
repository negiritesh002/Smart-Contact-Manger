<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base::Layout(~{::section})">
<head><meta charset="UTF-8"><title>Sign in</title></head>
<body>
<section class="auth-section">
    <div id="login" class="container">
        <div id="login-row" class="row justify-content-center align-items-center">
            <div id="login-column" class="col-md-6">
                <div id="login-box">
                    <div class="text-center eyebrow mb-3">Welcome back</div>
                    <form id="login-form" class="form" th:action="@{/dologin}" action="#" method="post">
                        <h3 class="text-center">Sign in to your space</h3>
                        <p class="auth-intro">Your connections, right where you left them.</p>
                        <div th:if="${param.error}" class="alert alert-danger" role="alert">Invalid username or password</div>
                        <div th:if="${param.logout}" class="alert alert-success" role="status">You have been logged out</div>
                        <div th:if="${param.change}" class="alert alert-success" role="status"><p th:text="${param.change}"></p></div>
                        <div class="form-group">
                            <label for="username">Email address</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="you@example.com" autocomplete="username">
                        </div>
                        <div class="form-group">
                            <label for="password">Password</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password">
                        </div>
                        <div class="login-options">
                            <label for="remember-me"><input id="remember-me" name="remember-me" type="checkbox"> Remember me</label>
                            <a th:href="@{/forgot}">Forgot password?</a>
                        </div>
                        <button type="submit" name="submit" class="btn btn-primary btn-block">Sign in &rarr;</button>
                        <div id="register-link" class="auth-footer">New here? <a th:href="@{/signup}">Create an account</a></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
