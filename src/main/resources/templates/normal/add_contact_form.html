<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::Layout(~{::section})}">
<head><meta charset="UTF-8"><title>Smart CRM</title></head><body>
<section>
<div class="page-heading"><div><div class="breadcrumb-label"><a th:href="@{/user/show-contacts/0}">Contacts</a> / Add new contact</div><h1>Add new contact</h1><p>Keep the details that help you stay connected.</p></div><a class="text-link" th:href="@{/user/show-contacts/0}">&larr; Back to contacts</a></div>
<form class="contact-editor" th:action="@{/user/process-contact}" method="post" enctype="multipart/form-data">
    <div class="panel">
        <div class="photo-upload"><span class="upload-avatar"><i class="far fa-user" aria-hidden="true"></i></span><div><label for="customFile">Contact photo</label><p>Choose an image from your device. Optional.</p><input type="file" name="profileImage" id="customFile" accept="image/*"></div></div>
        <div class="form-section"><div class="section-heading"><h2>Basic information</h2><span>Contact details</span></div><div class="form-grid"><div class="form-group"><label for="firstName">First name <span class="required-mark">*</span></label><input id="firstName" name="cName" type="text" class="form-control" placeholder="First name" required></div><div class="form-group"><label for="secondName">Last name <span class="required-mark">*</span></label><input id="secondName" name="secondName" type="text" class="form-control" placeholder="Last name" required></div><div class="form-group"><label for="email">Email address <span class="required-mark">*</span></label><input id="email" name="email" type="email" class="form-control" placeholder="Email address" required></div><div class="form-group"><label for="phone">Phone number <span class="required-mark">*</span></label><input id="phone" name="phone" type="tel" class="form-control" placeholder="Phone number" required></div></div></div>
        <div class="form-section"><div class="section-heading"><h2>Professional details</h2><span>Work &amp; organization</span></div><div class="form-group mb-0"><label for="work">Work / occupation <span class="required-mark">*</span></label><input id="work" name="work" type="text" class="form-control" placeholder="Work or organization" required></div></div>
        <div class="form-section"><div class="section-heading"><h2>Notes &amp; context</h2><span>Optional</span></div><label for="mytextarea" class="sr-only">Contact notes</label><textarea id="mytextarea" name="description" class="form-control" rows="5" placeholder="Add notes about this contact"></textarea></div>
    </div>
    <div class="editor-footer"><span><i class="fas fa-info-circle" aria-hidden="true"></i> Fields marked * are required.</span><div><a class="btn btn-light" th:href="@{/user/show-contacts/0}">Cancel</a><button class="btn btn-primary" type="submit"><i class="fas fa-check" aria-hidden="true"></i> Save contact</button></div></div>
</form>
<script src="https://cdn.tiny.cloud/1/nz8ho7k8kgt8ju0ggystv4he4uip09ukny5mk395vzga7lr6/tinymce/8/tinymce.min.js" referrerpolicy="origin" crossorigin="anonymous"></script>
<script>if (window.tinymce) { tinymce.init({selector:'#mytextarea', height:260, menubar:false}); }</script>
</section>
</body></html>
