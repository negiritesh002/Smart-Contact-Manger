<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:fragment="Layout(contant)">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
          integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <!--  apply css of our static folder-->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/crm.css}">
    <title th:text="${title}">Base html</title>

<!--    javascript jquery-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>

</head>
<body class="crm-app">

<header class="crm-topbar">
    <button type="button" onclick="toggleSidebar()" class="sidebar-toggle" aria-label="Toggle sidebar" aria-controls="workspace-sidebar" aria-expanded="true"><i class="fas fa-bars" aria-hidden="true"></i></button>
    <div class="search-container global-search">
        <label for="global-search" class="sr-only">Search contacts by name</label>
        <i class="fas fa-search search-icon" aria-hidden="true"></i>
        <input id="global-search" data-contact-search type="search" class="form-control" placeholder="Search your contacts by name" autocomplete="off" aria-controls="global-search-results" aria-expanded="false">
        <div id="global-search-results" class="search-result" aria-live="polite"></div>
    </div>
    <div class="topbar-actions">
        <a class="btn btn-primary" aria-label="Add new contact" th:href="@{/user/add-contact}"><i class="fas fa-plus" aria-hidden="true"></i> <span>New contact</span></a>
        <a class="account-menu" th:href="@{/user/profile}">
            <span class="letter-avatar" th:text="${#strings.substring(user.name,0,1)}"></span>
            <span class="account-name"><strong th:text="${user.name}"></strong><small th:text="${user.role == 'ROLE_ADMIN' ? 'Administrator' : 'Personal account'}"></small></span>
        </a>
        <a class="icon-link" th:href="@{/logout}" aria-label="Sign out" title="Sign out"><i class="fas fa-sign-out-alt" aria-hidden="true"></i></a>
    </div>
</header>
<aside id="workspace-sidebar" class="sidebar">
    <a class="crm-brand" th:href="@{/user/index}"><span class="brand-icon"><i class="fas fa-address-book" aria-hidden="true"></i></span> Smart CRM</a>
    <div class="workspace-label"><i class="far fa-address-book" aria-hidden="true"></i> Personal contacts</div>
    <p class="sidebar-caption">Main menu</p>
    <nav aria-label="Workspace navigation">
        <a id="home-link" th:href="@{/user/index}" class="item"><i class="fas fa-th-large" aria-hidden="true"></i> Dashboard / Overview</a>
        <a id="contacts-link" th:href="@{/user/show-contacts/0}" class="item"><i class="fas fa-users" aria-hidden="true"></i> All contacts <span class="nav-count" th:text="${#lists.size(user.contacts)}"></span></a>
        <a id="add-link" th:href="@{/user/add-contact}" class="item"><i class="fas fa-user-plus" aria-hidden="true"></i> Add contact</a>
    </nav>
    <div class="sidebar-bottom">
        <p class="sidebar-caption">Preferences</p>
        <a id="profile-link" th:href="@{/user/profile}" class="item"><i class="far fa-user-circle" aria-hidden="true"></i> User profile</a>
        <a id="settings-link" th:href="@{/user/settings}" class="item"><i class="fas fa-cog" aria-hidden="true"></i> Settings</a>
        <a th:href="@{/}" class="item"><i class="fas fa-arrow-left" aria-hidden="true"></i> Back to website</a>
    </div>
</aside>
<main class="content">
<!--    message box-->
    <div th:if="${session.message}" class="container">
        <div th:classappend="${'alert-' +session.message.type}" class="alert text-center" role="alert">
            <span th:text="${session.message.content}"></span>
        </div>
        <!--        <th:block th:text="${#session.removeAttribute('message')}"></th:block>-->
        <!--        in thymeleaf new version above 3.0 we can not use the session.removeAttribute, request,responseand seveletcontext-->
        <!--            we can use the Session Helper feature-->
        <th:block th:text="${@sessionHelper.removeMessageFromSession()}"></th:block>
    </div>

    <div th:replace="${contant}"></div>
</main>

<!--end of the content area-->

<!-- Optional JavaScript; choose one of the two! -->

<!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
        integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx"
        crossorigin="anonymous"></script>
<!--addin the sweetalert script-->
<script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
<script>
    function deleteContact(cId){
        swal({
            title: "Are you sure?",
            text: "You want to delete this contact!",
            icon: "warning",
            buttons: true,
            dangerMode: true,
        })
        .then((willDelete) => {
        if (willDelete) {
            window.location = "/user/delete/" +cId;
        } else{
            swal("Your Contact is safe!!");
            }
        });
    }

</script>
<!--adding script.js of or static folder file-->
<script th:src="@{/js/script.js}"></script>
<!-- Option 2: jQuery, Popper.js, and Bootstrap JS
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js" integrity="sha384-w1Q4orYjBQndcko6MimVbzY0tgp4pWB4lZ7lr30WKz0vr/aWKhXdBNmNb5D92v7s" crossorigin="anonymous"></script>
-->
</body>
</html>
