<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::Layout(~{::section})}">
<head><meta charset="UTF-8"><title>Contact details</title></head><body><section>
<div th:if="${contact}">
    <div class="page-heading"><div><div class="breadcrumb-label"><a th:href="@{/user/show-contacts/0}">Contacts</a> / Contact details</div><h1 th:text="${contact.cName + ' ' + (contact.secondName == null ? '' : contact.secondName)}"></h1><p>Contact details and notes.</p></div><form method="post" th:action="@{'/user/update-contact/'+${contact.cId}}"><button type="submit" class="btn btn-primary"><i class="fas fa-pencil-alt" aria-hidden="true"></i> Edit contact</button></form></div>
    <div class="panel profile-hero"><div class="profile-cover"></div><div class="profile-header"><img class="profile-avatar" th:src="@{'/img/'+${contact.image}}" alt="Contact photo"><div><h2 th:text="${contact.cName + ' ' + (contact.secondName == null ? '' : contact.secondName)}"></h2><p th:text="${contact.work}"></p></div><div class="profile-count"><small>Contact ID</small><strong th:text="${contact.cId}"></strong></div></div></div>
    <div class="profile-grid"><div class="panel"><div class="panel-heading"><h2>Contact information</h2></div><div class="profile-details"><div><label>Email address</label><p th:text="${#strings.isEmpty(contact.email) ? '—' : contact.email}"></p></div><div><label>Phone number</label><p th:text="${#strings.isEmpty(contact.phone) ? '—' : contact.phone}"></p></div><div class="full-width"><label>Work / occupation</label><p th:text="${#strings.isEmpty(contact.work) ? '—' : contact.work}"></p></div><div class="full-width"><label>Notes &amp; context</label><div class="bio-content" th:if="${#strings.isEmpty(contact.description)}">No notes added.</div><div class="bio-content" th:unless="${#strings.isEmpty(contact.description)}" th:utext="${contact.description}"></div></div></div></div><div class="panel"><div class="panel-heading"><h2>Manage contact</h2></div><a class="subtle-action" th:href="@{/user/show-contacts/0}">Back to all contacts &rarr;</a><div class="px-3 pb-3"><button type="button" class="btn btn-danger btn-block" th:onclick="|deleteContact(${contact.cId})|">Delete contact</button></div></div></div>
</div>
<div th:unless="${contact}" class="panel empty-state"><h1>Contact unavailable</h1><p>You do not have permission to view this contact.</p><a th:href="@{/user/show-contacts/0}" class="btn btn-primary">Back to contacts</a></div>
</section></body></html>
