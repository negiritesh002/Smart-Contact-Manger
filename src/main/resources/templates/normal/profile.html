<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::Layout(~{::section})}">
<head><meta charset="UTF-8"><title>Smart CRM</title></head><body>
<section>
<div class="page-heading"><div><h1>User profile</h1><p>Your personal workspace and account details.</p></div><a class="btn btn-light" th:href="@{/user/settings}"><i class="fas fa-key" aria-hidden="true"></i> Change password</a></div>
<div class="profile-tabs"><span class="selected"><i class="far fa-user" aria-hidden="true"></i> Overview &amp; profile</span><a th:href="@{/user/settings}"><i class="fas fa-shield-alt" aria-hidden="true"></i> Password settings</a></div>
<div class="panel profile-hero"><div class="profile-cover"></div><div class="profile-header"><span class="letter-avatar profile-avatar" th:text="${#strings.substring(user.name,0,1)}"></span><div><h2 th:text="${user.name}"></h2><p th:text="${user.email}"></p><span class="status-badge" th:text="${user.enabled ? 'Active account' : 'Inactive account'}"></span></div><div class="profile-count"><small>Total contacts</small><strong th:text="${#lists.size(user.contacts)}"></strong><a th:href="@{/user/show-contacts/0}">View contacts &rarr;</a></div></div></div>
<div class="profile-grid"><div class="panel"><div class="panel-heading"><h2><i class="far fa-address-card" aria-hidden="true"></i> General information</h2><span class="section-label">Account details</span></div><div class="profile-details"><div><label>Full name</label><p th:text="${user.name}"></p></div><div><label>Email address</label><p th:text="${user.email}"></p></div><div><label>Account ID</label><p th:text="${'SCMUSER ' + user.id}"></p></div><div><label>Account role</label><p th:text="${user.role}"></p></div><div class="full-width"><label>About you</label><div class="bio-content" th:text="${#strings.isEmpty(user.about) ? 'No bio added.' : user.about}"></div></div></div></div><div class="panel profile-security"><div class="panel-heading"><h2><i class="fas fa-shield-alt" aria-hidden="true"></i> Account settings</h2></div><p>Update your password from settings.</p><a class="subtle-action" th:href="@{/user/settings}">Open password settings &rarr;</a></div></div>
</section>
</body></html>
