<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{normal/base::Layout(~{::section})}">
<head><meta charset="UTF-8"><title>Smart CRM</title></head><body>
<section>
<div class="page-heading"><div><h1>Settings</h1><p>Manage your account password.</p></div></div>
<div class="panel settings-panel"><div class="panel-heading"><h2><i class="fas fa-key" aria-hidden="true"></i> Change password</h2></div><form th:action="@{/user/change-password}" method="post" class="settings-form"><div class="form-group"><label for="oldPassword">Current password</label><input id="oldPassword" name="oldPassword" type="password" autocomplete="current-password" class="form-control" required></div><div class="form-group"><label for="newPassword">New password</label><input id="newPassword" name="newPassword" type="password" autocomplete="new-password" class="form-control" required></div><div class="d-flex justify-content-end"><button type="reset" class="btn btn-light mr-2">Reset</button><button type="submit" class="btn btn-primary">Update password</button></div></form></div>
</section>
</body></html>
