<!DOCTYPE html>
<html lang="en" xmlns:th = "http://www.thymeleaf.org" th:replace = "base::Layout(~{::section})">
<head>
    <meta charset="UTF-8">
    <title>Change Password Form</title>
</head>
<body>
<section>
    <div id="login">

        <div class="container">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" style="height: 220px" class="col-md-12">
                        <div th:if="${session.message}" class="alert alert-danger" th:text="${session.message.content}"></div>
                        <h3 class="mt-3">Enter New Password</h3>
                        <form action="" th:action="@{/change-password}" method="post">
                            <div class="form-group">
                                <input type="password" name="newPassword" minlength="8" maxlength="72" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,72}" title="Use 8-72 characters, including a letter and a number; at most 72 UTF-8 bytes." class="form-control" placeholder="Enter New Password Here" required>
                            </div>
                            <div class="container text-center">
                                <button class="btn btn-primary">Change Password</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
